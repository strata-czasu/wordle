name: Lint and Test

on:
  push:
    branches:
      - main
  pull_request:

env:
  BUN_VERSION: 1.3.9
  WORDLE_PUBLIC_DISCORD_SDK_MODE: mock
  WORDLE_PUBLIC_APPLICATION_ID: "000000000000000000"
  WORDLE_APPLICATION_PUBLIC_KEY: "c2a6cbe78944fc8ec79fb741db8dfea7c7d8059f867eb8a91aadbc805061f8a0"
  WORDLE_OAUTH_CLIENT_SECRET: "000000000000000000"
  WORDLE_BOT_TOKEN: dummy
  WORDLE_BOT_COMMAND_GUILD_IDS: "000000000000000000"
  WORDLE_JWT_SECRET: dummy
  WORDLE_DATABASE_URL: "file:./dev.db"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Run Linting
        run: bunx biome lint .

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Check Formatting
        run: bunx biome format .

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install
      - name: Generate Prisma Client
        run: bun prisma-generate
      - name: Check Types
        run: bun typecheck

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install
      - name: Generate Prisma Client
        run: bun prisma-generate
      - name: Check migrations
        run: bun prisma-check-migrations

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install
      - name: Generate Prisma Client
        run: bun prisma-generate
      - name: Run tests
        run: bun test
